# Experiment-driver project: dependencies on our own libraries are declared BY
# COMMIT via [tool.uv.sources] (the replacement for git submodules).
#
# Bump a dependency: edit its `rev`, then `uv lock && uv sync`.
# Local development against sibling checkouts instead of pins:
#   scripts/bootstrap_env.sh --dev   (uv sync, then editable overrides)
#
# POLICY: never hand-edit installed copies. A fix lands in its source repo,
# is pushed, the rev here is bumped, and the env is re-synced.
[project]
name = "b2b-transfer-experiments"
version = "0.1.0"
description = "Morphology-agnostic HVAC transfer experiments on Building2Building"
requires-python = ">=3.11"
dependencies = [
    "morel",
    "morel-amorpheus",
    "morel-b2b",
    "morel-b2b-amorpheus",
    "morel-b2b-modumorph",
    "morel-modumorph",
    "building2building",
    "minergym",
]

[tool.uv]
package = false
# b2b's own pyproject pins minergym to an older fork (vtaboga/minergym@956c3e1);
# force OUR adjacency-fixed commit everywhere:
override-dependencies = [
    "building2building @ git+ssh://git@github.com/vtaboga/Building2Building@698ca69ab35655247caae59062b9ab07ceea7b48",
    "minergym @ git+ssh://git@github.com/Terramorpha/minergym@75200862c49a8f192e2ea8996edefb8be1ed9b16",
]   # scripts repo: manage the env, don't build/install this project

[tool.uv.sources]
morel = { git = "ssh://git@github.com/Terramorpha/morel", rev = "89c04843808d82134ef3c3da1abe9b4248319a78" }
morel-amorpheus = { git = "ssh://git@github.com/Terramorpha/morel", rev = "89c04843808d82134ef3c3da1abe9b4248319a78", subdirectory = "third_party/morel_amorpheus" }
morel-b2b = { git = "ssh://git@github.com/Terramorpha/morel", rev = "89c04843808d82134ef3c3da1abe9b4248319a78", subdirectory = "third_party/morel_b2b" }
morel-b2b-amorpheus = { git = "ssh://git@github.com/Terramorpha/morel", rev = "89c04843808d82134ef3c3da1abe9b4248319a78", subdirectory = "third_party/morel_b2b_amorpheus" }
morel-b2b-modumorph = { git = "ssh://git@github.com/Terramorpha/morel", rev = "89c04843808d82134ef3c3da1abe9b4248319a78", subdirectory = "third_party/morel_b2b_modumorph" }
morel-modumorph = { git = "ssh://git@github.com/Terramorpha/morel", rev = "89c04843808d82134ef3c3da1abe9b4248319a78", subdirectory = "third_party/morel_modumorph" }
building2building = { git = "ssh://git@github.com/vtaboga/Building2Building", rev = "698ca69ab35655247caae59062b9ab07ceea7b48" }
minergym = { git = "ssh://git@github.com/Terramorpha/minergym", rev = "75200862c49a8f192e2ea8996edefb8be1ed9b16" }
