# Experiment-driver project: dependencies on our own libraries are declared BY
# COMMIT via [tool.uv.sources] (the replacement for git submodules).
#
# The pin chain is coherent end-to-end: this file pins morel and b2b by sha;
# b2b@f4752f1 itself pins minergym@7520086 (adjacency fix); morel@b5fd380's
# morel_b2b pins that same b2b sha. No override-dependencies needed.
#
# Bump a dependency: edit its rev, then `uv lock && uv sync`.
# Local development against sibling checkouts: scripts/bootstrap_env.sh --dev
#
# POLICY: never hand-edit installed copies. A fix lands in its source repo,
# is pushed, the rev chain is bumped bottom-up, and the env is re-synced.
[project]
name = "b2b-transfer-experiments"
version = "0.1.0"
description = "Morphology-agnostic HVAC transfer experiments on Building2Building"
requires-python = ">=3.11,<3.14"
dependencies = [
    "morel",
    "morel-amorpheus",
    "morel-b2b",
    "morel-b2b-amorpheus",
    "morel-b2b-modumorph",
    "morel-modumorph",
    "building2building",
    "minergym",
    # driver-script deps (training loggers, tuners, figures)
    "wandb",
    "optuna",
    "matplotlib",
]

[tool.uv]
package = false

[tool.uv.sources]
morel = { git = "ssh://git@github.com/Terramorpha/morel", rev = "9903a3ce386f5a218e4dca02a1364f110a4011cf" }
morel-amorpheus = { git = "ssh://git@github.com/Terramorpha/morel", rev = "9903a3ce386f5a218e4dca02a1364f110a4011cf", subdirectory = "third_party/morel_amorpheus" }
morel-b2b = { git = "ssh://git@github.com/Terramorpha/morel", rev = "9903a3ce386f5a218e4dca02a1364f110a4011cf", subdirectory = "third_party/morel_b2b" }
morel-b2b-amorpheus = { git = "ssh://git@github.com/Terramorpha/morel", rev = "9903a3ce386f5a218e4dca02a1364f110a4011cf", subdirectory = "third_party/morel_b2b_amorpheus" }
morel-b2b-modumorph = { git = "ssh://git@github.com/Terramorpha/morel", rev = "9903a3ce386f5a218e4dca02a1364f110a4011cf", subdirectory = "third_party/morel_b2b_modumorph" }
morel-modumorph = { git = "ssh://git@github.com/Terramorpha/morel", rev = "9903a3ce386f5a218e4dca02a1364f110a4011cf", subdirectory = "third_party/morel_modumorph" }
building2building = { git = "ssh://git@github.com/vtaboga/Building2Building", rev = "a608a7844321dda903e3797da64676ccaeef9861" }
minergym = { git = "ssh://git@github.com/Terramorpha/minergym", rev = "1cc47dea940119e718d140c09966254a1f8d4105" }
